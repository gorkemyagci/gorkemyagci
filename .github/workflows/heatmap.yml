name: Heatmap

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draw heatmap
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.HEATMAP_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/heatmap.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap-light.svg assets/heatmap-dark.svg
          git diff --cached --quiet || git commit -m "Update heatmap"
          git push
